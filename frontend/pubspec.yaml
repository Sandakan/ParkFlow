    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.11.1
  riverpod_generator: ^4.0.0+1
  json_serializable: ^6.11.2
  freezed: ^3.2.3
  go_router_builder: ^4.2.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
