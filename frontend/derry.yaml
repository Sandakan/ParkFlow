clean_build:
  - flutter clean
  - dart run build_runner clean
  - flutter pub get
  - dart run build_runner build --delete-conflicting-outputs

start_ios:
  - xcrun simctl list
  - open /Applications/Xcode.app/Contents/Developer/Applications/Simulator.app/

clean:
  - flutter clean
  - flutter pub get

purge:
  - pod deintegrate
  #- rm Flutter/Flutter.podspec
  - flutter clean
  - flutter pub get
  #- pod install
  #- flutter run

purge_all:
  - pod deintegrate
  - rm Flutter/Flutter.podspec
  - flutter clean
  - flutter pub cache repair
  - flutter pub get
  #- pod install
  - flutter run

generate_launcher_icons:
  - dart run flutter_launcher_icons

build_app: flutter build apk --release --target-platform=android-arm64
build_debug: flutter build apk --debug

# Docker commands - env values are read from .env files (source of truth)
docker_build: docker build -t parkflow:dev ../backend
docker_build_dev: docker build --build-arg ENVIRONMENT=development -t parkflow:dev ../backend
docker_build_test: docker build --build-arg ENVIRONMENT=testing -t parkflow:test ../backend
docker_build_prod: docker build --build-arg ENVIRONMENT=production -t parkflow:prod ../backend

docker_run: docker run -p 8000:8000 parkflow:dev
docker_run_dev: docker run -p 8000:8000 parkflow:dev
docker_run_test: docker run -p 8001:8000 parkflow:test
docker_run_prod: docker run -p 8080:8000 parkflow:prod

# Docker Compose commands (recommended for easier management)
compose_up: cd ../backend && docker compose up -d backend
compose_up_dev: cd ../backend && docker compose up -d backend
compose_up_test: cd ../backend && docker compose --profile testing up -d backend
compose_up_prod: cd ../backend && docker compose --profile production up -d backend

compose_build: cd ../backend && docker compose build backend
compose_build_dev: cd ../backend && docker compose build backend
compose_build_test: cd ../backend && docker compose build backend
compose_build_prod: cd ../backend && docker compose build backend

compose_down: cd ../backend && docker compose down
compose_down_all: cd ../backend && docker compose down --volumes --remove-orphans

# Docker Compose watch mode (auto-rebuild on file changes)
compose_watch: cd ../backend && docker compose watch backend
compose_watch_dev: cd ../backend && docker compose watch backend
compose_watch_test: cd ../backend && docker compose watch backend
compose_watch_prod: cd ../backend && docker compose watch backend
