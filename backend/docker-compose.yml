services:
  backend:
    container_name: parkflow-backend
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --reload
    develop:
      watch:
        - action: sync
          path: ./app
          target: /app/app
    env_file:
      - ./.env
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/parkflow
    depends_on:
      - db

  db:
    image: postgres:18
    container_name: parkflow_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: parkflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
