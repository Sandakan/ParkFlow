services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  mediamtx:
    image: bluenviron/mediamtx:1.6.0
    container_name: parkflow-mediamtx
    ports:
      - "8554:8554" # RTSP
      - "1935:1935" # RTMP
      - "8888:8888" # HLS
      - "8889:8889" # WebRTC
      - "8189:8189/udp" # WebRTC UDP ICE
      - "9997:9997" # MediaMTX HTTP API
    volumes:
      - ./mediamtx.yml:/mediamtx.yml
    restart: always

  backend:
    container_name: parkflow-backend
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
      - "5678:5678"
    command: python -m debugpy --listen 0.0.0.0:5678 -m uvicorn app.main:app --host 0.0.0.0 --reload
    develop:
      watch:
        - action: sync
          path: ./app
          target: /app/app
    env_file:
      - ./.env
    environment:
      # REDIS_URL points to the local redis container
      - REDIS_URL=redis://redis:6379
      # MONGODB_URL is expected to be in the .env file (Atlas connection string)
    depends_on:
      - redis
      - mediamtx

volumes:
  redis_data:
